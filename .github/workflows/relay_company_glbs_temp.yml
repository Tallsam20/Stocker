name: Temporary Company GLB relay
on:
  push:
    branches: [relay-company-glbs-20260921]
    paths: [".github/workflows/relay_company_glbs_temp.yml"]
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: relay
      - name: Verify existing public CC0 model bytes
        run: |
          set -euo pipefail
          mkdir -p /tmp/company
          unzip -q relay/company_glbs_pinned.zip -d /tmp/company
          cd /tmp/company
          echo 'c9ed171bbb10c622214a1f67c08d425b255494ee5d6e616d1bd36f11ee0f15c4  elf.glb' | sha256sum -c -
          echo '435622a3c14683d4d5c5093d2c805d2ad993e26cd42b3faabbd63e46e58257f7  knight.glb' | sha256sum -c -
          echo '83f16c40acc1d9370bcebe3ce7c50191707a9843b93a31b453f8546ea1cb3c9d  mage.glb' | sha256sum -c -
          echo 'd331926b56ca2eac03f6e41457e2ea867d3501b206dea08454a5944b0a1b11bd  nain.glb' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: company-exact-cc0-glbs
          path: /tmp/company/*.glb
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

name: Upload temporary Company artifact relay
on:
  push:
    branches:
      - relay-company-glbs-20260921
    paths:
      - ".github/workflows/upload_company_artifact_temp.yml"
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relay-company-glbs-20260921
      - name: Verify relay ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s relay/company_glbs_pinned.zip
          sha256sum relay/company_glbs_pinned.zip
      - name: Upload relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: emberhold-company-glbs-pinned-public-relay
          path: relay/company_glbs_pinned.zip
          compression-level: 0
          retention-days: 1
